global
    maxconn 10000
    log /dev/log local0
    log /dev/log local1 notice
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 1d
    tune.h2.initial-window-size 1048576
    tune.ssl.default-dh-param 2048
    tune.bufsize 65536
    tune.maxrewrite 16384
    tune.ssl.cachesize 50000
    tune.ssl.ssl-ctx-cache-size 5000
    # chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

    # SSL Config
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

defaults
    log global
    mode tcp
    # option tcplog
    # option dontlognull
    option tcp-smart-connect
    option tcp-smart-accept
    timeout connect 5s
    timeout client  2h
    timeout server  2h
    timeout tunnel 2h
    timeout client-fin 30s
    
frontend http
    mode tcp
    bind *:80 tfo
    bind :::80 v6only tfo

    tcp-request inspect-delay 1s
    tcp-request content accept if { req.len gt 0 }

    acl is_ssh payload(0,18) -m bin 5353482d322e30
    #use_backend ssh_proxy if is_ssh

    default_backend nginx_http

frontend https
    mode tcp
    bind *:443 ssl crt /etc/haproxy/hap.pem alpn h2,http/1.1 tfo
    bind :::443 v6only ssl crt /etc/haproxy/hap.pem alpn h2,http/1.1 tfo

    tcp-request inspect-delay 2s
    tcp-request content accept if { req_ssl_hello_type 1 }

    # Logging
    # log-format "%ci:%cp [%t] %ft %b/%s %B %ts SNI:%[ssl_fc_sni] ALPN:%[ssl_fc_alpn]"

    # ===== ACL =====
    acl is_sni ssl_fc_has_sni
    acl is_h1 ssl_fc_alpn -i http/1.1
    acl is_h2 ssl_fc_alpn -i h2
    acl alpn_found ssl_fc_alpn -m found

    # Payload detection
    acl is_up payload(0,256) -m sub -i "Connection: Upgrade"
    acl is_ws payload(0,256) -m sub -i "Upgrade: websocket"

    acl xray_xhttp payload(0,256) -m reg -i /(vmess|vless|trojan|shadowsocks)-xhttp
    acl xray_upgrade payload(0,256) -m reg -i /(vmess|vless|trojan|shadowsocks)-upgrade
    acl xray payload(0,256) -m reg -i /(vmess|vless|trojan|shadowsocks)

    # SSH over TLS (SNI ada + ALPN kosong)
    #use_backend ssh_proxy if is_sni !alpn_found
    
    #use_backend openssh_backend if is_ssh

    # HTTP/1.1 & WebSocket
    use_backend nginx_http if is_h1
    use_backend nginx_http if is_up or is_ws

    # Xray path
    use_backend nginx_http if xray_xhttp or xray_upgrade or xray

    # HTTP/2
    use_backend nginx_https if is_h2

    # HTTPS biasa (fallback SNI)
    use_backend nginx_http if is_sni

    default_backend nginx_http

backend nginx_http
    mode tcp
    server xray-ws 127.0.0.1:10100 send-proxy

backend nginx_https
    mode tcp
    server xray-grpc 127.0.0.1:10200 send-proxy

