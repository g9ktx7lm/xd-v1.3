server {
    listen 127.0.0.1:10100 proxy_protocol so_keepalive=on reuseport;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name xxx;

    # Tuning Buffer & Timeout
    client_body_buffer_size 512K;
    client_header_buffer_size 16k;
    client_max_body_size 4M;
    large_client_header_buffers 2 32k;
    client_header_timeout 1s;
    keepalive_timeout 1s;

    # Security Headers
    add_header X-HTTP-LEVEL-HEADER 1;
    add_header X-ANOTHER-HTTP-LEVEL-HEADER 1;
    add_header X-XSS-Protection "1; mode=block";

    # Prioritas Wajib xHTTP - Upgrade
    # --- 1. xHTTP ---
    location ~ /vless-xhttp {
        proxy_pass http://127.0.0.1:20009;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /vmess-xhttp {
        proxy_pass http://127.0.0.1:20010;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /trojan-xhttp {
        proxy_pass http://127.0.0.1:20011;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /shadowsocks-xhttp {
        proxy_pass http://127.0.0.1:20012;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- 2. Upgrade ---
    location ~ /vless-upgrade {
        proxy_pass http://127.0.0.1:20013;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /vmess-upgrade {
        proxy_pass http://127.0.0.1:20014;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /trojan-upgrade {
        proxy_pass http://127.0.0.1:20015;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /shadowsocks-upgrade {
        proxy_pass http://127.0.0.1:20016;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- 3. Websocket ---
    location ~ /vless {
        proxy_pass http://127.0.0.1:20001;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /vmess {
        proxy_pass http://127.0.0.1:20002;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /trojan {
        proxy_pass http://127.0.0.1:20003;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /shadowsocks {
        proxy_pass http://127.0.0.1:20004;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ / {
        proxy_pass http://127.0.0.1:10015;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 127.0.0.1:10200 http2 proxy_protocol so_keepalive=on reuseport;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name xxx;

    # Tuning Buffer & Timeout
    client_body_buffer_size 512K;
    client_header_buffer_size 16k;
    client_max_body_size 4M;
    large_client_header_buffers 2 32k;
    client_header_timeout 1s;
    keepalive_timeout 1s;

    # Security Headers
    add_header X-HTTP-LEVEL-HEADER 1;
    add_header X-ANOTHER-HTTP-LEVEL-HEADER 1;

    # Prioritas Wajib xHTTP - Grpc
    # --- 1. xHTTP ---
    location ~ /vless-xhttp {
        grpc_pass grpc://127.0.0.1:20009;
        proxy_redirect off;
        proxy_buffering off;
        proxy_request_buffering off;
        grpc_set_header Host $host;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /vmess-xhttp {
        grpc_pass grpc://127.0.0.1:20010;
        proxy_redirect off;
        proxy_buffering off;
        proxy_request_buffering off;
        grpc_set_header Host $host;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /trojan-xhttp {
        grpc_pass grpc://127.0.0.1:20011;
        proxy_redirect off;
        proxy_buffering off;
        proxy_request_buffering off;
        grpc_set_header Host $host;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /shadowsocks-xhttp {
        grpc_pass grpc://127.0.0.1:20012;
        proxy_redirect off;
        proxy_buffering off;
        proxy_request_buffering off;
        grpc_set_header Host $host;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- 2. gRPC ---
    location ~ /(vless-grpc|vless/Tun) {
        grpc_pass grpc://127.0.0.1:20005;
        proxy_redirect off;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /(vmess-grpc|vmess/Tun) {
        grpc_pass grpc://127.0.0.1:20006;
        proxy_redirect off;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /(trojan-grpc|trojan/Tun) {
        grpc_pass grpc://127.0.0.1:20007;
        proxy_redirect off;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /(shadowsocks-grpc|shadowsocks/Tun) {
        grpc_pass grpc://127.0.0.1:20008;
        proxy_redirect off;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

}
